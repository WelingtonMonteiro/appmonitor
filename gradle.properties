# The IntelliJ Platform already bundles the Kotlin stdlib - don't bundle our own copy into the
# plugin zip (avoids clashing with the platform's). We compile against the platform's stdlib.
kotlin.stdlib.default.dependency=false

# No JDK 17 is installed here (only the JetBrains Runtimes shipped with the local IDEs), so point
# Gradle at them and compile with the JBR 21 toolchain while still emitting Java 17 bytecode
# (options.release / jvmTarget = 17), keeping the plugin loadable on 2023.3 (JBR 17). This avoids a
# toolchain auto-download. Add your own JDK path here if you prefer.
org.gradle.java.installations.paths=/home/welington-monteiro/Applications/WebStorm-2024.2.4/jbr,/home/welington-monteiro/Applications/WebStorm-2026.1/jbr

# Reproducible, quieter builds
org.gradle.configuration-cache=false
org.gradle.caching=true
